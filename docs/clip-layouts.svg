<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b74c4"/><stop offset="1" stop-color="#2d3a6b"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="p1"><rect x="150" y="100" width="230" height="408" rx="18"/></clipPath>
    <clipPath id="p2"><rect x="620" y="100" width="230" height="408" rx="18"/></clipPath>
  </defs>
  <rect width="1000" height="560" rx="24" fill="url(#bg)"/>
  <text x="500" y="48" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Two looks for every clip (1080x1920)</text>

  <!-- blur layout -->
  <g clip-path="url(#p1)">
    <rect x="150" y="100" width="230" height="408" fill="url(#scene)" filter="url(#blur)" opacity="0.7"/>
    <rect x="150" y="240" width="230" height="130" fill="url(#scene)"/>
    <circle cx="265" cy="292" r="26" fill="#f2c9a0"/><rect x="232" y="318" width="66" height="52" rx="18" fill="#1d2440"/>
  </g>
  <rect x="150" y="100" width="230" height="408" rx="18" fill="none" stroke="#c9d1e8" stroke-width="3"/>
  <text x="265" y="410" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" stroke="#000" stroke-width="1">HERE'S <tspan fill="#ffd54a">WHAT</tspan> WORKS</text>
  <text x="265" y="538" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">--layout blur  (default)</text>
  <text x="440" y="250" fill="#c9d1e8" font-size="15">whole frame stays</text>
  <text x="440" y="272" fill="#c9d1e8" font-size="15">visible, blurred copy</text>
  <text x="440" y="294" fill="#c9d1e8" font-size="15">fills the background.</text>
  <text x="440" y="324" fill="#c9d1e8" font-size="15">Works for any video.</text>

  <!-- crop layout -->
  <g clip-path="url(#p2)">
    <rect x="620" y="100" width="230" height="408" fill="url(#scene)"/>
    <circle cx="735" cy="250" r="62" fill="#f2c9a0"/><rect x="655" y="312" width="160" height="200" rx="60" fill="#1d2440"/>
  </g>
  <rect x="620" y="100" width="230" height="408" rx="18" fill="none" stroke="#c9d1e8" stroke-width="3"/>
  <text x="735" y="410" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" stroke="#000" stroke-width="1">HERE'S <tspan fill="#ffd54a">WHAT</tspan> WORKS</text>
  <text x="735" y="538" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">--layout crop</text>
  <text x="870" y="250" fill="#c9d1e8" font-size="15">fills the screen.</text>
  <text x="870" y="272" fill="#c9d1e8" font-size="15">Best when the</text>
  <text x="870" y="294" fill="#c9d1e8" font-size="15">speaker is in</text>
  <text x="870" y="316" fill="#c9d1e8" font-size="15">the middle.</text>
  <text x="500" y="88" text-anchor="middle" fill="#8f9bc4" font-size="15">Captions show 3 words at a time. The word being spoken lights up gold.</text>
</svg>
