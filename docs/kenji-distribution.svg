<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd54a"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">How Kenji spreads one clip everywhere</text>
  <text x="600" y="80" text-anchor="middle" fill="#8f9bc4" font-size="16">You connect your accounts once. Every clip after that is one command.</text>

  <!-- clip -->
  <rect x="60" y="180" width="150" height="250" rx="22" fill="#0b1020" stroke="#ffd54a" stroke-width="3"/>
  <rect x="75" y="200" width="120" height="210" rx="10" fill="#26315a"/>
  <rect x="75" y="262" width="120" height="68" fill="#4a5c9c"/>
  <rect x="88" y="348" width="94" height="14" rx="5" fill="#fff"/><rect x="120" y="348" width="34" height="14" rx="5" fill="#ffd54a"/>
  <text x="135" y="462" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">your-clip-1.mp4</text>

  <!-- arrow clip -> kenji -->
  <path d="M215,305 C280,305 300,305 360,305" stroke="#ffd54a" stroke-width="4" fill="none"/>
  <text x="288" y="292" text-anchor="middle" fill="#c9d1e8" font-size="14">post.py</text>

  <!-- kenji hub -->
  <circle cx="500" cy="305" r="135" fill="url(#gold)"/>
  <text x="500" y="282" text-anchor="middle" fill="#0b1020" font-size="34" font-weight="800">Kenji AI</text>
  <text x="500" y="312" text-anchor="middle" fill="#0b1020" font-size="16" font-weight="700">Social Planner</text>
  <text x="500" y="342" text-anchor="middle" fill="#0b1020" font-size="14">1. stores the video</text>
  <text x="500" y="362" text-anchor="middle" fill="#0b1020" font-size="14">2. posts or schedules it</text>
  <text x="500" y="382" text-anchor="middle" fill="#0b1020" font-size="14">3. tracks every post</text>

  <!-- spokes -->
  <g stroke="#ffd54a" stroke-width="3" fill="none" opacity="0.9">
    <path d="M630,250 C720,170 760,140 830,140"/>
    <path d="M636,280 C730,230 760,215 830,215"/>
    <path d="M638,300 C740,292 770,290 830,290"/>
    <path d="M638,320 C740,345 770,365 830,365"/>
    <path d="M634,340 C730,410 760,440 830,440"/>  </g>
  <g font-size="17" font-weight="700" fill="#fff">
    <rect x="830" y="116" width="320" height="48" rx="24" fill="#1877f2"/><text x="856" y="146">Facebook  ·  Reels + Page posts</text>
    <rect x="830" y="191" width="320" height="48" rx="24" fill="#d62976"/><text x="856" y="221">Instagram  ·  Reels</text>
    <rect x="830" y="266" width="320" height="48" rx="24" fill="#111" stroke="#25f4ee" stroke-width="2"/><text x="856" y="296">TikTok</text>
    <rect x="830" y="341" width="320" height="48" rx="24" fill="#ff0033"/><text x="856" y="371">YouTube  ·  Shorts</text>
    <rect x="830" y="416" width="152" height="48" rx="24" fill="#0a66c2"/><text x="852" y="446">LinkedIn</text>
    <rect x="998" y="416" width="152" height="48" rx="24" fill="#e60023"/><text x="1018" y="446">Pinterest</text>
  </g>
  <text x="990" y="494" text-anchor="middle" fill="#8f9bc4" font-size="14">every account you connected, in one pass</text>
</svg>
