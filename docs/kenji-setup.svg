<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffd54a"/></marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Kenji setup: about 10 minutes, one time</text>

  <g text-anchor="middle">
    <rect x="40" y="85" width="340" height="200" rx="18" fill="#1b2442" stroke="#2c3866"/>
    <circle cx="210" cy="125" r="24" fill="#ffd54a"/><text x="210" y="134" font-size="24" font-weight="800" fill="#0b1020">1</text>
    <text x="210" y="182" font-size="21" font-weight="700" fill="#fff">Get your Kenji account</text>
    <text x="210" y="214" font-size="16" fill="#c9d1e8">Sign up, then log in at</text>
    <text x="210" y="238" font-size="16" fill="#ffd54a">app.kenjiai.com</text>

    <rect x="430" y="85" width="340" height="200" rx="18" fill="#1b2442" stroke="#2c3866"/>
    <circle cx="600" cy="125" r="24" fill="#ffd54a"/><text x="600" y="134" font-size="24" font-weight="800" fill="#0b1020">2</text>
    <text x="600" y="182" font-size="21" font-weight="700" fill="#fff">Connect your socials</text>
    <text x="600" y="214" font-size="16" fill="#c9d1e8">Marketing &gt; Social Planner</text>
    <text x="600" y="238" font-size="16" fill="#c9d1e8">FB, IG, TikTok, YouTube, LinkedIn</text>

    <rect x="820" y="85" width="340" height="200" rx="18" fill="#1b2442" stroke="#2c3866"/>
    <circle cx="990" cy="125" r="24" fill="#ffd54a"/><text x="990" y="134" font-size="24" font-weight="800" fill="#0b1020">3</text>
    <text x="990" y="182" font-size="21" font-weight="700" fill="#fff">Create your API key</text>
    <text x="990" y="214" font-size="16" fill="#c9d1e8">Settings &gt; Private Integrations</text>
    <text x="990" y="238" font-size="16" fill="#c9d1e8">paste it + Location ID into .env</text>
  </g>
  <g stroke="#ffd54a" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M384,185 L424,185"/><path d="M774,185 L814,185"/></g>
</svg>
